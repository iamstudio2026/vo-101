server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups;
        try_files $uri $uri/ /index.html;
    }

    # vo101-engine user API (same origin: no CORS, no model keys in the browser).
    # Only /v1 is exposed; the API-key routes used by n8n stay internal.
    # Resolved per request so nginx still starts if the engine container is down.
    location /engine/v1/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $engine http://vo101_engine:9100;
        rewrite ^/engine(/v1/.*)$ $1 break;
        proxy_pass $engine;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 200s;
        client_max_body_size 12m;
    }

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
